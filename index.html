<!DOCTYPE html>
<html>
<head>
  <title>VeritySeek</title>
  <style>
    body {
      font-family: Arial;
      background: #ffffff;
      text-align: center;
      padding: 50px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background: #0b5cff;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Get Your Money Back</h1>
    <p>Generate a legal demand letter in 30 seconds</p>

    <select>
      <option>Select your state</option>
      <option>California</option>
      <option>New York</option>
    </select>

    <input placeholder="Amount owed ($)">
    <input placeholder="Who owes you money?">
    <input placeholder="Your name">

    <button>Generate Demand Letter ($9.9)</button>
  </div>

</body>
</html>
